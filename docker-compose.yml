services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: imoboo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [imoboo]

  redis:
    image: redis:7-alpine
    container_name: imoboo-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [imoboo]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imoboo-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ImobooCRM;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      Evolution__BaseUrl: ${EVOLUTION_BASE_URL}
      Evolution__ApiKey: ${EVOLUTION_API_KEY}
      Cors__Origins__0: ${FRONTEND_URL:-http://localhost:4200}
      App__PublicBaseUrl: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      - "5080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [imoboo]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:5080}
    container_name: imoboo-web
    ports:
      - "4200:80"
    depends_on:
      - api
    networks: [imoboo]

  # --- Evolution API: integração de WhatsApp. Peça externa ao ImobooCRM,
  # mas roda no mesmo compose por conveniência. Tem Postgres e Redis próprios,
  # separados dos do ImobooCRM, para não misturar dado de aplicações diferentes.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: imoboo-evolution
    restart: always
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379"
      CACHE_REDIS_SAVE_INSTANCES: "true"
    ports:
      - "8080:8080"
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis
    networks: [imoboo]

  evolution-postgres:
    image: postgres:15-alpine
    container_name: imoboo-evolution-postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    networks: [imoboo]

  evolution-redis:
    image: redis:7-alpine
    container_name: imoboo-evolution-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution-redis-data:/data
    networks: [imoboo]

volumes:
  sqlserver-data:
  redis-data:
  uploads-data:
  evolution-instances:
  evolution-postgres-data:
  evolution-redis-data:

networks:
  imoboo:
    driver: bridge
